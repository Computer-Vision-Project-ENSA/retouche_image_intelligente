
name: CD - Continuous Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/computer-vision-project-ensa/retouche-image
  RESOURCE_GROUP: rg-retouche-image
  CONTAINER_APP: retouche-image-app

jobs:
  deploy:
    name: Build, Publish and Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      # 1. Retrieve source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build and publish Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 4. Authenticate to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Deploy new Docker image to Azure
      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # 6. Confirm deployment
      - name: Deployment completed
        run: echo "Azure Container Apps deployment command completed."
