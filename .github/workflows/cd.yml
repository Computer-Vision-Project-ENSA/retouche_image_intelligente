
name: CD - Deploy Application

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          python -m pytest backend/tests frontend/tests -v

      - name: Build Docker image
        run: |
          docker build -t retouche-image .

      - name: Prepare deployment files
        run: |
          mkdir -p .space-deploy

          cp Dockerfile .space-deploy/
          cp -r backend frontend ml .space-deploy/

          cat > .space-deploy/README.md <<'EOF'
          ---
          title: Suppression Intelligente d'Objets
          emoji: 🖼️
          sdk: docker
          app_port: 7860
          ---
          EOF

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install huggingface_hub

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path=".space-deploy",
              commit_message="Deploy from GitHub Actions",
              delete_patterns=["*"],
          )
          PY
